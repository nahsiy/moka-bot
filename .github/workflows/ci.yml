name: Validation
"on":
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.17"
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - run: uv run moka --config config.example.toml check
      - run: uv run moka demo
      - run: uv build
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t moka:validation .
      - name: Vérifier le conteneur sans token ni connexion Discord
        run: |
          docker run --rm --read-only --tmpfs /tmp:size=64m,mode=1777 \
            --entrypoint sh moka:validation -ec '
              test "$(id -u)" = 10001
              deno --version
              ffmpeg -version
              python -m yt_dlp --version
              moka --config /app/config.toml check
              moka demo
            '
