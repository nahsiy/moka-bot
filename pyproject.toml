[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "moka-community-bot"
version = "0.4.0"
description = "Un compagnon Discord modulaire pour les communautés francophones."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14,<4",
    "discord-py[voice]>=2.7.1,<3",
    "pillow>=11,<13",
    "yt-dlp[default]>=2026.10.14",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[project.scripts]
moka = "moka.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/moka"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/moka", "/tests", "/docs", "/assets/branding", "/assets/previews",
    "/pyproject.toml", "/uv.lock", "/README.md", "/CHANGELOG.md",
    "/THIRD_PARTY_NOTICES.md", "/LICENSE", "/PLAN.md", "/SECURITY.md",
    "/config.example.toml", "/config.test.toml", "/Dockerfile", "/compose.yaml",
    "/.env.example", "/.dockerignore", "/.python-version", "/.github/workflows/ci.yml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
