name: Validation
"on":
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-24.04
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.9.17"
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - run: uv run moka --config config.example.toml check
      - run: uv run moka demo
      - run: uv build
  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t moka:validation .
      - name: Vérifier le conteneur sans token ni connexion Discord
        run: |
          docker run --rm --init --cpus=2 --memory=1g --pids-limit=256 \
            --read-only --tmpfs /tmp:size=64m,mode=1777 \
            --cap-drop ALL --security-opt no-new-privileges \
            --entrypoint sh moka:validation -ec '
              test "$(id -u)" = 10001
              deno --version
              ffmpeg -version
              python -m yt_dlp --version
              python -c "from moka.cogs.horoscope import ART; from PIL import Image; Image.open(ART).verify()"
              moka --config /app/config.toml check
              moka demo
            '
