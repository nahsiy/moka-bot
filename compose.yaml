services:
  moka:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      MOKA_DATA_DIR: /data
      MOKA_CONFIG: /app/config.toml
    volumes:
      - moka-data:/data
      - ./config.example.toml:/app/config.toml:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  moka-data:
